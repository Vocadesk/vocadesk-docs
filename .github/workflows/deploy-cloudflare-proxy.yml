name: Deploy callcat.ai Cloudflare Worker proxies

# docs.callcat.ai and embed-cdn.callcat.ai are Cloudflare Worker routes
# (callcat.ai zone, already on Cloudflare) that forward to docs.vocadesk.com
# and cdn.vocadesk.com respectively — same idiom as app.callcat.ai -> the
# vocafront2-prod Cloudflare Pages project. GitHub Pages stays the single
# source of content for both; nothing is duplicated. embed-cdn-proxy lives
# here (not in embed-sdk, its logical owner) because this repo's
# CLOUDFLARE_API_TOKEN is the one with Workers deploy permission.

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/docs-proxy/**"
      - "cloudflare/embed-cdn-proxy/**"
      - ".github/workflows/deploy-cloudflare-proxy.yml"
  workflow_dispatch:

jobs:
  deploy-docs-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/docs-proxy
          command: deploy

  deploy-embed-cdn-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/embed-cdn-proxy
          command: deploy
